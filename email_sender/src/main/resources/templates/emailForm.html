<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sender - Sleek UI</title>
    <style>
        /* (Same CSS you gave – full glassmorphism design) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #533483 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow-x: hidden; position: relative;
        }
        body::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 20% 30%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(120, 219, 226, 0.3) 0%, transparent 50%);
            pointer-events: none;
        }
        .container { width: 100%; max-width: 500px; padding: 20px; position: relative; z-index: 1; }
        .email-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
            padding: 40px 32px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: cardFloat 6s ease-in-out infinite; position: relative; overflow: hidden;
        }
        .email-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 3s infinite;
        }
        @keyframes cardFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes shimmer { 0% { left: -100%; } 100% { left: 100%; } }
        .header { text-align: center; margin-bottom: 32px; }
        .title {
            color: #fff; font-size: 28px; font-weight: 700; margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #a8edea 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: rgba(255, 255, 255, 0.6); font-size: 14px; }
        .form-group { margin-bottom: 24px; }
        .form-label { display: block; color: rgba(255, 255, 255, 0.8); font-size: 13px; margin-bottom: 8px; text-transform: uppercase; }
        .form-input, .form-textarea {
            width: 100%; background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
            padding: 16px 20px; color: #fff; font-size: 16px;
            backdrop-filter: blur(10px); transition: all 0.3s ease;
        }
        .form-input:focus, .form-textarea:focus {
            outline: none; border-color: rgba(120, 219, 226, 0.6);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 20px rgba(120, 219, 226, 0.2);
        }
        .form-textarea { min-height: 120px; resize: vertical; }
        .send-button {
            width: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none; border-radius: 16px; padding: 18px 24px;
            color: #fff; font-size: 16px; font-weight: 600; text-transform: uppercase;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .send-button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4); }
        .success-message { text-align: center; color: #4ade80; font-weight: 500; margin-top: 16px; }
    </style>
</head>
<body>
<div class="container">
    <div class="email-card">
        <div class="header">
            <h1 class="title">Send Email</h1>
            <p class="subtitle">Craft your message with style</p>
        </div>

        <form action="/sendEmail" method="post">
            <div class="form-group">
                <label class="form-label" for="toEmail">Recipient</label>
                <input type="email" id="toEmail" name="toEmail" class="form-input" placeholder="Enter recipient's email" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="subject">Subject</label>
                <input type="text" id="subject" name="subject" class="form-input" placeholder="What's this about?" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="body">Message</label>
                <textarea id="body" name="body" class="form-textarea" placeholder="Type your message here..." required></textarea>
            </div>
            <button type="submit" class="send-button">Send Message</button>
        </form>

        <div class="success-message" th:text="${message}"></div>
    </div>
</div>
</body>
</html>
